# Upptime configuration for the AnythingMCP status page.
# Docs: https://upptime.js.org/docs/configuration
owner: HelpCode-ai
repo: anythingmcp-status

sites:
  # Backend health: database, Redis and process memory. Answers 503 when one is down.
  - name: Cloud API
    slug: cloud-api
    url: https://cloud.anythingmcp.com/health
    maxResponseTime: 10000
  # A real MCP handshake (initialize) on the public demo server: proves the gateway answers MCP clients.
  - name: MCP gateway
    slug: mcp-gateway
    url: https://cloud.anythingmcp.com/mcp/demo
    method: POST
    headers:
      - "Content-Type: application/json"
      - "Accept: application/json, text/event-stream"
      - "MCP-Protocol-Version: 2025-06-18"
    body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"anythingmcp-status","version":"1"}}}'
    maxResponseTime: 10000
  - name: Cloud web app
    slug: cloud-web-app
    url: https://cloud.anythingmcp.com/login
    maxResponseTime: 10000
  - name: Website
    slug: website
    url: https://anythingmcp.com
    maxResponseTime: 10000

status-website:
  cname: status.anythingmcp.com
  logoUrl: https://anythingmcp.com/logo.svg
  favicon: https://anythingmcp.com/logo.svg
  name: AnythingMCP Status
  introTitle: "**AnythingMCP** system status"
  introMessage: Live availability of AnythingMCP Cloud, the MCP gateway and anythingmcp.com, checked every five minutes from outside our own infrastructure. Self-hosted instances are not covered.
  theme: light
  navbar:
    - title: Status
      href: /
    - title: AnythingMCP
      href: https://anythingmcp.com
    - title: Developers
      href: https://anythingmcp.com/developers
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
